<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - User Management</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .admin-container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 500px;
            max-height: 90vh;
            overflow-y: auto; /* Enables scrolling if needed */
        }

        h2 {
            margin-bottom: 15px;
            font-size: 22px;
            color: #333;
        }

        input, button {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .user-list {
            margin-top: 15px;
            text-align: left;
        }

        .user-box {
            background: #ffffff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            margin-bottom: 10px;
            text-align: center;
        }

        .user-box label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
            color: #333;
        }

        .user-box input {
            width: calc(100% - 20px);
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .button-group {
            display: flex;
            justify-content: space-between;
        }

        .update-btn {
            background: #007bff;
            width: 48%;
        }

        .remove-btn {
            background: red;
            width: 48%;
        }

        .remove-btn:hover {
            background: darkred;
        }

        .back-link {
            display: block;
            margin-top: 15px;
            text-align: center;
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <h2>Admin Panel - User Management</h2>

        <form method="POST">
            <input type="email" name="email" placeholder="User Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit" name="action" value="add">Add User</button>
        </form>

        <div class="user-list">
            <h3>Registered Users</h3>
            {% for email in users %}
                <div class="user-box">
                    <label>{{ email }}</label>
                    <form method="POST">
                        <input type="hidden" name="email" value="{{ email }}">
                        <input type="password" name="password" placeholder="New Password">
                        <div class="button-group">
                            <button type="submit" class="update-btn" name="action" value="edit">Update</button>
                            {% if email != user %}
                                <button type="submit" class="remove-btn" name="action" value="remove">Remove</button>
                            {% endif %}
                        </div>
                    </form>
                </div>
            {% endfor %}
        </div>

        <a href="{{ url_for('index') }}" class="back-link">Back to Dashboard</a>
    </div>
</body>
</html>
