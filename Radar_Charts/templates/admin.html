<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - Skills Radar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/devoteam.png') }}">
    <style>
        .admin-wrapper {
            min-height: 100vh;
            padding: 40px 20px;
        }
        .admin-container {
            max-width: 600px;
            margin: 0 auto;
        }
        .admin-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .admin-header img {
            height: 40px;
            margin-bottom: 16px;
        }
        .admin-header h1 {
            font-size: 24px;
            color: var(--devoteam-gray);
            margin: 0 0 8px 0;
        }
        .admin-header p {
            color: var(--devoteam-gray-light);
            margin: 0;
        }
    </style>
</head>
<body class="admin-wrapper">
    <div class="admin-container">
        <div class="admin-header">
            <img src="{{ url_for('static', filename='img/devoteam_logo.png') }}" alt="Devoteam">
            <h1>User Management</h1>
            <p>Add, edit, or remove user accounts</p>
        </div>

        <!-- Add User Card -->
        <div class="card">
            <div class="card-header">
                <h3 class="card-title"><i class="fas fa-user-plus" style="color: var(--devoteam-coral); margin-right: 8px;"></i> Add New User</h3>
            </div>
            <form method="POST">
                <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                    <input type="email" name="email" placeholder="Email address" required style="flex: 1; min-width: 200px;">
                    <input type="password" name="password" placeholder="Password" required style="flex: 1; min-width: 150px;">
                    <button type="submit" name="action" value="add" class="btn btn-primary">
                        <i class="fas fa-plus"></i> Add User
                    </button>
                </div>
            </form>
        </div>

        <!-- User List Card -->
        <div class="card">
            <div class="card-header">
                <h3 class="card-title"><i class="fas fa-users" style="color: var(--devoteam-coral); margin-right: 8px;"></i> Registered Users</h3>
                <span style="color: var(--devoteam-gray-light); font-size: 14px;">{{ users|length }} users</span>
            </div>

            {% for email in users %}
            <div class="user-item">
                <div class="user-email">
                    <i class="fas fa-envelope" style="color: var(--devoteam-coral); margin-right: 8px;"></i>
                    {{ email }}
                    {% if email == user %}
                    <span style="background: var(--devoteam-coral); color: white; padding: 2px 8px; border-radius: 12px; font-size: 11px; margin-left: 8px;">You</span>
                    {% endif %}
                </div>
                <form method="POST">
                    <input type="hidden" name="email" value="{{ email }}">
                    <div class="user-actions">
                        <input type="password" name="password" placeholder="New password">
                        <button type="submit" name="action" value="edit" class="btn btn-secondary btn-sm">
                            <i class="fas fa-save"></i> Update
                        </button>
                        {% if email != user %}
                        <button type="submit" name="action" value="remove" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure you want to remove this user?')">
                            <i class="fas fa-trash"></i>
                        </button>
                        {% endif %}
                    </div>
                </form>
            </div>
            {% endfor %}
        </div>

        <!-- Back Link -->
        <div style="text-align: center; margin-top: 24px;">
            <a href="{{ url_for('index') }}" class="btn btn-outline">
                <i class="fas fa-arrow-left"></i> Back to Dashboard
            </a>
        </div>
    </div>
</body>
</html>
