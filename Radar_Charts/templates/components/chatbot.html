<!-- Chatbot Widget Component -->

<!-- Chat Toggle Button -->
<button id="chat-toggle-btn" class="chat-toggle-btn" title="Ask AI Assistant">
    <img class="chat-icon" src="{{ url_for('static', filename='img/bot.png') }}" alt="Chat">
    <svg class="close-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
    </svg>
</button>

<!-- Chat Container -->
<div id="chat-container" class="chat-container">
    <!-- Header -->
    <div class="chat-header">
        <div class="chat-header-icon">
            <img src="{{ url_for('static', filename='img/bot.png') }}" alt="Bot">
        </div>
        <div class="chat-header-text">
            <h3>Staffing Assistant</h3>
            <p>Powered by Gemini AI</p>
        </div>
    </div>

    <!-- Messages -->
    <div id="chat-messages" class="chat-messages">
        <!-- Messages will be inserted here -->
    </div>

    <!-- Quick Suggestions -->
    <div id="chat-suggestions" class="chat-suggestions">
        <button class="suggestion-btn">Who are the top performers?</button>
        <button class="suggestion-btn">Find employees for a GenAI project</button>
        <button class="suggestion-btn">Who has the most availability?</button>
        <button class="suggestion-btn">Compare team skills</button>
    </div>

    <!-- Input -->
    <div class="chat-input-container">
        <input
            type="text"
            id="chat-input"
            class="chat-input"
            placeholder="Ask about employees..."
            autocomplete="off"
        >
        <button id="chat-send-btn" class="chat-send-btn" title="Send">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
        </button>
    </div>
</div>
