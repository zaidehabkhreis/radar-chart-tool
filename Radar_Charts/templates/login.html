<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Skills Radar</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/devoteam.png') }}">
</head>
<body class="login-wrapper">
    <div class="login-card">
        <div class="login-header">
            <div class="login-logo-container">
                <img src="{{ url_for('static', filename='img/devoteam_logo.png') }}" alt="Devoteam">
            </div>
            <h2>Skills Radar</h2>
        </div>
        <div class="login-body">
            <form method="POST">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="your.name@devoteam.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-primary">
                    Sign In
                </button>
            </form>
            {% if error %}
            <div class="login-error">
                {{ error }}
            </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
